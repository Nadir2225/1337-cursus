[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Translate natural language prompts into function calls"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]

[tool.mypy]
exclude = [
    "^llm_sdk/",
    "^.venv/",
]
