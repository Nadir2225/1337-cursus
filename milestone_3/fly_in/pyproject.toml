[project]
name = "flyin"
version = "0.1.0"
description = "fly-in project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "flake8>=7.0.0",
]

[tool.mypy]
exclude = [
    "^.venv/",
]
